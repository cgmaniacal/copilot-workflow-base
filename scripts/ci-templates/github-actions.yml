name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{SETUP_STEPS}} — Add runtime setup here (e.g., actions/setup-node, actions/setup-python, actions/setup-dotnet)
      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"
      - name: Lint
        run: "{{LINT_COMMAND}}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{SETUP_STEPS}}
      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"
      - name: Test
        run: "{{TEST_COMMAND}}"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      # {{SETUP_STEPS}}
      - name: Install dependencies
        run: "{{INSTALL_COMMAND}}"
      - name: Build
        run: "{{BUILD_COMMAND}}"
